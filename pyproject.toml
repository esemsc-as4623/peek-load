[project]
name = "rtl"
version = "0.1.0"
description = "Rooftops to Load Curves: open building footprints to building-level energy-demand data for Rwanda (OSEAS26)"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl"]

# ---------------------------------------------------------------------------
# pixi environment. All dependencies for every workstream are declared here up
# front so parallel branches never fight over pixi.lock.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# core data stack
python-duckdb = ">=1.1"
pyarrow = ">=16"
pandas = ">=2.2"
geopandas = ">=1.0"
pyogrio = "*"
shapely = ">=2.0"
pyproj = "*"
gdal = "*"
rasterio = "*"
exactextract = "*"
h3-py = ">=4"
# climate
xarray = "*"
zarr = "*"
gcsfs = "*"
netcdf4 = "*"
cdsapi = "*"
earthengine-api = "*"
# contracts, config, IO
pandera = "*"
pydantic-settings = "*"
python-dotenv = "*"
pyyaml = "*"
httpx = "*"
tqdm = "*"
pymupdf = "*"
# EDA / viz / tiles
matplotlib = "*"
jupyterlab = "*"
jupytext = "*"
tippecanoe = "*"
# dev
pytest = "*"
ruff = "*"
pre-commit = "*"

[tool.pixi.pypi-dependencies]
rtl = { path = ".", editable = true }
anthropic = ">=0.70"
rampdemand = "*"

[tool.pixi.tasks]
# --- ingest (one task per source; each writes data/raw/<source>/<version>/ + data/manifest.json)
fetch-vida = "python -m rtl.ingest.vida"
fetch-osm = "python -m rtl.ingest.osm"
fetch-dhs-api = "python -m rtl.ingest.dhs_api"
register-local = "python -m rtl.ingest.local"
fetch-rasters = "python -m rtl.ingest.ghsl && python -m rtl.ingest.worldpop && python -m rtl.ingest.rwi"
# --- A4 evidence + anchors (evidence needs ANTHROPIC_API_KEY; `pixi run evidence --dry-run` does not)
fetch-evidence-docs = "python -m rtl.ingest.evidence_docs"
evidence = "python -m rtl.llm.evidence"
llm-ledger = "python -m rtl.llm.cache"
dhs-priors = "python -m rtl.ingest.dhs_api --priors"
anchors = "python -m rtl.ingest.evidence_docs --anchors"
archetype-smoke = "python -m rtl.archetypes"
# --- A2v vector context (each ingest writes data/interim/layers/*.parquet; join needs buildings_base)
fetch-admin = "python -m rtl.ingest.admin"
fetch-overture = "python -m rtl.ingest.overture"
fetch-gridfinder = { cmd = "python -m rtl.ingest.gridfinder", depends-on = ["fetch-admin"] }
fetch-facilities = { cmd = "python -m rtl.ingest.facilities", depends-on = ["fetch-osm"] }
context-vector = "python -m rtl.join.vector"  # after fetch-admin/-overture/-gridfinder/-facilities
# --- A3 climate + DEM (fetch-openmeteo takes ~2 h: paced for the free-tier rate limit, resumable)
fetch-dem = "python -m rtl.ingest.dem"
fetch-openmeteo = "python -m rtl.ingest.openmeteo"
fetch-power = "python -m rtl.ingest.power"
climate-h3 = "python -m rtl.climate.build"
# --- conform
conform-buildings = { cmd = "python -m rtl.conform.buildings", depends-on = ["fetch-vida"] }
context-raster = "python -m rtl.join.raster"  # needs fetch-rasters once (re-clipping GHSL takes minutes)
make-fixture = { cmd = "python -m rtl.conform.fixture", depends-on = ["conform-buildings"] }
fetch-25d = "python -m rtl.ingest.open_buildings_25d"
conform-height = "python -m rtl.conform.height"
report-height = "python -m rtl.conform.height_report"
assemble-context = "python -m rtl.join.assemble"
derive = "python -m rtl.derive"  # re-tunable columns from config/params.yaml (no raster re-sampling unless --presence)
# --- EDA (jupytext percent scripts; open as notebooks with `jupytext --to ipynb`)
eda-01 = "python notebooks/01_footprints.py"
# --- quality gates
qa = "python -m rtl.qa"
test = "pytest -q"
lint = "ruff check src tests"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
