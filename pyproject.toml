[project]
name = "rtl"
version = "0.1.0"
description = "Rooftops to Load Curves: open building footprints to building-level energy-demand data for Rwanda (OSEAS26)"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl"]

# ---------------------------------------------------------------------------
# pixi environment. All dependencies for every workstream are declared here up
# front so parallel branches never fight over pixi.lock.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# core data stack
python-duckdb = ">=1.1"
pyarrow = ">=16"
pandas = ">=2.2"
geopandas = ">=1.0"
pyogrio = "*"
shapely = ">=2.0"
pyproj = "*"
gdal = "*"
rasterio = "*"
exactextract = "*"
h3-py = ">=4"
# climate
xarray = "*"
zarr = "*"
gcsfs = "*"
netcdf4 = "*"
cdsapi = "*"
earthengine-api = "*"
# contracts, config, IO
pandera = "*"
pydantic-settings = "*"
python-dotenv = "*"
pyyaml = "*"
httpx = "*"
tqdm = "*"
pymupdf = "*"
# EDA / viz / tiles
matplotlib = "*"
jupyterlab = "*"
jupytext = "*"
tippecanoe = "*"
# dev
pytest = "*"
ruff = "*"
pre-commit = "*"

[tool.pixi.pypi-dependencies]
rtl = { path = ".", editable = true }
anthropic = ">=0.70"
rampdemand = "*"

[tool.pixi.tasks]
# --- ingest (one task per source; each writes data/raw/<source>/<version>/ + data/manifest.json)
fetch-vida = "python -m rtl.ingest.vida"
fetch-osm = "python -m rtl.ingest.osm"
fetch-dhs-api = "python -m rtl.ingest.dhs_api"
register-local = "python -m rtl.ingest.local"
# --- conform
conform-buildings = { cmd = "python -m rtl.conform.buildings", depends-on = ["fetch-vida"] }
make-fixture = { cmd = "python -m rtl.conform.fixture", depends-on = ["conform-buildings"] }
assemble-context = "python -m rtl.join.assemble"
# --- EDA (jupytext percent scripts; open as notebooks with `jupytext --to ipynb`)
eda-01 = "python notebooks/01_footprints.py"
# --- quality gates
qa = "python -m rtl.qa"
test = "pytest -q"
lint = "ruff check src tests"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
