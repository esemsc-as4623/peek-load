# GDAL OSM driver config for rtl.ingest.osm: only the tags the building-use codebook and context layers need.
# `building:levels` is laundered to `building_levels`. other_tags is off: unlisted tags are not used anywhere.
[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,healthcare,historic,landuse,leisure,man_made,military,natural,office,place,shop,sport,tourism,industrial
attribute_name_laundering=yes

[points]
osm_id=yes
attributes=name,amenity,shop,craft,office,tourism,healthcare,industrial,man_made,religion,building,leisure,power
other_tags=no

[lines]
osm_id=yes
attributes=name,highway,power,voltage,railway
other_tags=no

[multipolygons]
osm_id=yes
attributes=name,building,building:levels,amenity,shop,craft,office,tourism,healthcare,industrial,man_made,religion,leisure,landuse,power
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name
other_tags=no

[other_relations]
osm_id=yes
attributes=name
other_tags=no
