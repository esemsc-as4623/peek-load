# Human gate decisions by the repo owner. Cited by docs/datasheet.md and docs/ai_use.md.
# A blanket approval is recorded as such; it is never presented as a row-by-row review.

evidence_review:
  decision: approved
  scope: reports/review/evidence_review.csv as of commit ee90948 (1,067 RAMP-relevant values)
  date: 2026-10-11
  by: repo owner
  basis: >-
    Blanket approval without row-by-row review. Values are additionally screened by automated plausibility and
    consistency checks (rtl.demand.validate); rows those checks flag are excluded from appliance profiles unless
    the owner overrides them in reports/review/validation_flags.csv.

profile_mapping:
  decision: approved
  scope: config/profile_mapping.yaml as of commit ee90948
  date: 2026-10-11
  by: repo owner

  note: household profile ids renamed on 2026-10-12 at the owner's request (t1/t2/t3 suffixes were not MTF tiers);
    rules unchanged

archetypes:
  decision: approved
  scope: config/archetypes.yaml assumptions (reports/review/archetype_assumptions.csv) as of commit 947682f
  date: 2026-10-12
  by: repo owner
  basis: Sign-off of the archetype assumptions; data-derived values rest on the evidence approval and the MTF aggregates.

class_probabilities:
  decision: approved
  scope: config/profile_mapping.yaml min_class_probability 0.10 and area_level_classes [productive_use]
  date: 2026-10-12
  by: repo owner
  basis: >-
    Per building, class probabilities under 0.10 are ignored (the rest renormalised) to keep the real commercial and
    institutional signal. Productive use is not taken from the labeller: its demand sits on trade-tagged buildings
    plus an "unlocated" area amount from the NISR Establishment Census 2023, shown on the map in its own colour.

productive_use_method:
  decision: approved
  scope: located (trade tags) + unlocated (census, per area) + candidate ranking on the dashboard criteria
  date: 2026-10-12
  by: repo owner
  note: >-
    The owner set the rule "mills only in rural, roadside settings; tailors, welders and carpenters in towns".
    The exact trade shares, eligibility thresholds and candidate weights in config/productive_use.yaml are
    implementation choices still awaiting sign-off (see "Not yet approved").

gold_labels:
  note: >-
    Owner's caution (2026-10-12): the gold labels are not reliable ground truth. The imagery showed little beyond
    vegetation and roof shape (flat or pitched); roof shape may have swayed some decisions but matters little.
    Agreement with them measures consistency between two uncertain readers, not accuracy.

