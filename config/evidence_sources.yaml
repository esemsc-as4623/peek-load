# Sources of the web-research evidence that archetypes cite (owner's request, 2026-10-16).
# The productive-use research (rtl.llm.productive_use) sometimes answered with footnotes ([1], [B]) or named
# sources in passing instead of linked citations, so those rows were stored with doc_id "unnamed". The source lists
# in its cached answers name them; each cited row is mapped here to a document in evidence_docs.yaml
# (status: web = a cited web page, not downloaded; quotes are the research's sentences, not checked against it).
# `quote` rewords a row's sentence for the site; values are unchanged. rtl.demand.review applies this file.

