# A4 evidence corpus: public reports that RAMP archetype parameters may cite.
# `pixi run fetch-evidence-docs` downloads each `status: verified` doc to
# data/raw/evidence_docs/<version>/<doc_id>.pdf via rtl.manifest.fetch (recorded in data/manifest.json).
#
# Fields
#   licence:  as stated by the publisher; "to_verify" = human licence review pending (a human gate)
#   topics:   ownership | power | usage | consumption | tariff | access | households | productive_use
#   status:   verified (url checked to return a PDF on 2026-10-08) | unavailable (kept for the record)
#   role:     evidence, except validation-only docs (anchors; never used as features)

documents:
