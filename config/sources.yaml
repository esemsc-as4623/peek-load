# Source catalog: the single place every dataset is declared.
# Each ingest module reads its entry, downloads into data/raw/<id>/<version>/, and records
# url, sha256, bytes, and retrieval time in data/manifest.json.
#
# Fields
#   owner:    workstream responsible (A1 footprints, A2 context, A3 climate, A4 evidence)
#   access:   open | login | restricted (no redistribution of raw data)
#   licence:  licence of the raw data; outputs inherit the strictest share-alike term (ODbL)
#   status:   verified (url checked) | to_verify (owner agent confirms url/licence before ingest)
#   role:     feature | weak_label | validation | evidence   (validation sources are never used as features)

sources:
  # ------------------------------------------------------------------ A1 footprints
  vida_buildings:
    owner: A1
    name: VIDA combined Google V3 + Microsoft + OSM building footprints (Rwanda partition)
    url: https://data.source.coop/vida/google-microsoft-osm-open-buildings/geoparquet/by_country/country_iso=RWA/RWA.parquet
    docs: https://source.coop/vida/google-microsoft-osm-open-buildings
    access: open
    licence: ODbL-1.0 (Google Open Buildings CC-BY-4.0/ODbL, Microsoft ODbL, OSM ODbL)
    role: feature
    status: verified

  google_25d_temporal:
    owner: A1
    name: Google Open Buildings 2.5D Temporal (height, presence, fractional count; 2016-2023; 4 m)
    url: null  # public GCS GeoTIFF tiles; A1 resolves the tile list for Rwanda
    docs: https://sites.research.google/gr/open-buildings/temporal
    access: open
    licence: CC-BY-4.0 / ODbL-1.0
    role: feature
    status: to_verify

  # ------------------------------------------------------------------ A2 context
  osm_geofabrik:
    owner: A2
    name: OpenStreetMap Rwanda extract (Geofabrik)
    url: https://download.geofabrik.de/africa/rwanda-latest.osm.pbf
    access: open
    licence: ODbL-1.0
    role: feature  # tags on buildings are also used as weak labels (A5)
    status: verified

  overture_places:
    owner: A2
    name: Overture Maps places theme (POIs with categories + confidence)
    url: s3://overturemaps-us-west-2/release/{release}/theme=places/type=place/*  # bbox-filtered with DuckDB
    release: 2026-09-23.1  # latest per https://stac.overturemaps.org/catalog.json on 2026-10-08
    docs: https://docs.overturemaps.org/
    access: open
    licence: CDLA-Permissive-2.0
    role: weak_label
    status: verified

  admin_boundaries:
    owner: A2
    name: Rwanda admin boundaries (province, district, sector, cell, village), geoBoundaries gbOpen ADM0-5
    # {level} = ADM0..ADM5. Counts 5/30/416/2148/14815 (official: 14,837 villages; 22 missing in source).
    # ADM1 from Rwanda Geo Portal 2020, ADM2-4 Open Data Rwanda 2012, ADM5 World Bank 2012.
    # OCHA COD-AB (cod-ab-rwa, CC BY-IGO) was rejected: its ADM4 has only 1,000 of 2,148 cells and no villages.
    url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/RWA/{level}/geoBoundaries-RWA-{level}.geojson
    docs: https://www.geoboundaries.org/api/current/gbOpen/RWA/ALL/
    access: open
    licence: CC-BY-4.0  # per geoBoundaries API boundaryLicense (HDX mirror page says ODbL; API is authoritative)
    role: feature
    status: verified

  ghsl_built_c:
    owner: A2
    name: GHSL GHS-BUILT-C R2023A settlement characteristics, 2018 (MSZ classes + FUN RES/NRES, 10 m, ESRI:54009)
    # 1000 km Mollweide tiles; {product} = MSZ (class legend) or FUN (0 non-built, 1 RES, 2 NRES).
    # Rwanda falls in tiles R10_C21 and R10_C22 (computed in ingest/ghsl.py from aoi.yaml bbox).
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_C_GLOBE_R2023A/GHS_BUILT_C_{product}_E2018_GLOBE_R2023A_54009_10/V1-0/tiles/GHS_BUILT_C_{product}_E2018_GLOBE_R2023A_54009_10_V1_0_{tile}.zip
    docs: https://human-settlement.emergency.copernicus.eu/ghs_buC2023.php
    access: open
    licence: CC-BY-4.0  # copyright.txt on the JRC FTP
    role: feature
    status: verified

  ghsl_built_h:
    owner: A2
    name: GHSL GHS-BUILT-H R2023A average net building height (100 m)
    url: null  # tiles exist (ANBH ..._54009_100_V1_0_R10_C21/C22.zip, 19 MB); skipped: no contract column, A1 owns heights
    access: open
    licence: CC-BY-4.0
    role: feature
    status: skipped

  worldpop:
    owner: A2
    name: WorldPop Global2 R2025A constrained population count, 2023, 3 arc-second (~93 m) (Rwanda)
    # R2025A (Aug 2025) supersedes the 2020 constrained product (Global_2000_2020_Constrained/maxar_v1).
    # 2023 chosen to match the Google V3 footprint vintage; years 2015-2030 exist (human decision, see A2r.md).
    url: https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2023/RWA/v1/100m/constrained/rwa_pop_2023_CN_100m_R2025A_v1.tif
    docs: https://www.worldpop.org/
    access: open
    licence: CC-BY-4.0
    role: feature
    status: verified

  meta_hrsl:
    owner: A2
    name: Meta High Resolution Settlement Layer / population density (Rwanda, HDX)
    url: https://data.humdata.org/dataset/0ee1affc-6a90-4ad3-b7eb-166645668fc3/resource/a9013c82-cee9-43aa-a741-75a7595ca4fb/download/rwa_general_2020_geotiff.zip
    access: open
    licence: CC-BY-4.0
    role: feature
    status: skipped  # optional cross-check only; not ingested this phase

  meta_rwi:
    owner: A2
    name: Meta Relative Wealth Index (Rwanda, Bing quadkey level 14, ~2.4 km, April 2021)
    url: https://data.humdata.org/dataset/76f2a2ea-ba50-40f5-b79c-db95d668b843/resource/254e5daf-1ab0-47db-b40d-4abc2476e4ab/download/rwa_relative_wealth_index.csv
    docs: https://data.humdata.org/dataset/relative-wealth-index
    access: open
    licence: CC-BY-NC-4.0  # NON-COMMERCIAL (HDX license_other); outputs using `rwi` inherit NC. Cite Chi et al. 2022 PNAS
    role: feature
    status: verified

  viirs_ntl:
    owner: A2
    name: VIIRS night-time lights (annual VNL v2 or Black Marble)
    url: null
    access: login  # EOG or NASA Earthdata; or Earth Engine
    licence: to_verify
    role: validation
    status: blocked  # needs a login; validation-only, skipped by A2r

  copernicus_dem:
    owner: A3  # taken over from A2: A3 produces data/interim/dem_rwa_30m.tif, A2r samples it
    name: Copernicus DEM GLO-30 Public (1 arcsec DSM, COG tiles, AWS open data)
    # one 1x1 deg tile per SW corner; ingest/dem.py fills in the tile name
    url: https://copernicus-dem-30m.s3.amazonaws.com/{tile}/{tile}.tif
    docs: https://copernicus-dem-30m.s3.amazonaws.com/readme.html
    access: open
    # free for any use; attribution: "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018
    # provided under COPERNICUS by the European Union and ESA; all rights reserved"
    licence: Copernicus DEM GLO-30 Public licence (free incl. commercial, attribution required)
    role: feature
    status: verified

  gridfinder:
    owner: A2
    name: Gridfinder predicted MV grid lines (Arderne et al. 2020), global grid.gpkg v1.1.1
    url: https://zenodo.org/api/records/3628142/files/grid.gpkg/content  # Zenodo 10.5281/zenodo.3628142 (725 MB)
    access: open
    licence: CC-BY-4.0
    role: feature
    status: verified

  health_facilities:
    owner: A2
    name: Health facilities (healthsites.io export on HDX, dataset rwanda-healthsites; derived from OSM)
    url: https://data.humdata.org/dataset/67ca8390-678a-4eb0-8c06-a12d86df1033/resource/64be7983-aaa2-4b9c-ae5c-3b4a7fff66aa/download/rwanda.geojson
    access: open
    licence: ODbL-1.0
    role: weak_label
    status: verified

  # ------------------------------------------------------------------ A3 climate
  era5_arco:
    owner: A3
    name: ERA5 hourly 2 m temperature via ARCO-ERA5 public Zarr (0.25 deg)
    url: gs://gcp-public-data-arco-era5/  # anonymous access; A3 pins the exact store
    access: open
    licence: to_verify  # Copernicus C3S licence
    role: feature
    status: to_verify

  era5_land_cds:
    owner: A3
    name: ERA5-Land hourly 2 m temperature (0.1 deg) via Copernicus CDS
    url: null
    access: login  # ~/.cdsapirc
    licence: to_verify
    role: feature
    status: to_verify

  nasa_power:
    owner: A3
    name: NASA POWER hourly T2M (MERRA-2, cross-check at 4 towns) + daily GHI ALLSKY_SFC_SW_DWN (CERES SYN1deg, 1 deg)
    url: https://power.larc.nasa.gov/api/temporal/
    docs: https://power.larc.nasa.gov/docs/
    access: open
    licence: NASA open data (no restrictions; acknowledgement of the NASA LaRC POWER Project requested)
    role: feature
    status: verified

  openmeteo:
    owner: A3
    name: ERA5-Land hourly 2 m temperature (0.1 deg) via Open-Meteo Historical Weather API (no downscaling)
    url: https://archive-api.open-meteo.com/v1/archive
    docs: https://open-meteo.com/en/docs/historical-weather-api
    access: open  # free tier: non-commercial only; 600/5,000/10,000 weighted calls per minute/hour/day
    # Open-Meteo output CC-BY-4.0; underlying ERA5-Land: Copernicus licence, attribution "Contains modified
    # Copernicus Climate Change Service information"; cite Munoz Sabater (2019) doi:10.24381/cds.e2161bac
    licence: CC-BY-4.0 (Open-Meteo) + Copernicus C3S licence (ERA5-Land)
    role: feature
    status: verified

  # ------------------------------------------------------------------ A4 evidence + validation anchors
  census_2022:
    owner: A4
    name: Rwanda 5th Population and Housing Census 2022 (households by sector), NISR
    url: null
    access: open
    licence: to_verify
    role: validation
    status: to_verify

  dhs_api:
    owner: A4
    name: DHS Program public API indicators for Rwanda (household electricity + asset ownership, 2015/2019/2025)
    url: https://api.dhsprogram.com/rest/dhs/
    access: open
    licence: DHS Program terms (aggregate indicators, citation required)
    role: evidence
    status: verified

  dhs_2025:
    owner: A4
    name: Rwanda DHS 2025 (released 2026-08-05; microdata + GPS restricted)
    url: null
    access: restricted  # requires DHS Program approval; never redistribute microdata
    licence: DHS terms of use
    role: evidence
    status: to_verify

  dhs_2019:
    owner: A4
    name: Rwanda DHS 2019-20 (report public; microdata + GPS restricted)
    url: null
    access: restricted  # requires DHS Program approval; never redistribute microdata
    licence: DHS terms of use
    role: evidence
    status: to_verify

  mtf_rwanda:
    owner: A4
    name: World Bank Multi-Tier Framework energy access survey, Rwanda ("Beyond Connections")
    url: null
    access: login  # report open; microdata via World Bank Microdata Library
    licence: CC-BY-3.0-IGO (report)
    role: evidence
    status: to_verify

  qsel_rwanda:
    owner: A4
    name: Columbia QSEL / REG Rwanda electricity consumption analyses
    url: https://qsel.columbia.edu/Rwandas-path-to-universal-electricity-access-consumption-trends-tariff-impact-and-challenges-ahead
    access: open
    licence: to_verify
    role: validation
    status: verified  # PDFs in evidence_docs (qsel_*)

  evidence_docs:
    owner: A4
    name: Evidence corpus of public reports (DHS, MTF, EICV7, RPHC5, REG/RURA, QSEL, Efficiency for Access)
    url: null  # one url per document in config/evidence_docs.yaml; files -> data/raw/evidence_docs/<version>/<doc_id>.pdf
    access: open
    licence: per document (config/evidence_docs.yaml); several to_verify (human licence review)
    role: evidence  # docs marked role: validation in evidence_docs.yaml feed validation anchors only
    status: verified

