# B2: building -> RAMP profile mapping (`pixi run profile-mapping` applies it).
# Status: approved by the repo owner on 2026-10-11 (data/gold/approvals.yaml).
#
# Each building has Claude class probabilities (labels table). For each class, the rules below choose one or more
# profiles from the building's context. A building's weight on a profile = sum over classes of
# P(class) x units. `units` is additive: a shop-house is one household plus one shop, so its weights can sum above 1.
# Profiles are archetype ids in data/processed/archetypes/<id>.json (B1); any without a JSON yet is listed as
# missing by the runner.

# Per-building rule (owner's decision, 2026-10-12): class probabilities below min_class_probability are ignored
# and the rest renormalised, so a house's 1-5% spread over every class doesn't add up to phantom shops and mills
# across thousands of buildings, while real commercial and institutional signal (>= 0.10) is kept.
# Productive use is NOT taken from the labeller's probabilities (gold buildings marked productive use got only
# 0.02-0.05): its demand comes from trade tags on individual buildings plus an area-level "unlocated" amount from
# the Establishment Census (config/productive_use.yaml, `pixi run pu-demand`).
min_class_probability: 0.10
area_level_classes: [productive_use]  # dropped from the per-building weights before the threshold

context:
  urban:  # a building counts as urban if any of these hold
    pop_density_per_km2_min: 2500
    ghsl_classes: [res_3_6m, res_6_15m, res_15_30m, res_gt30m, nres_le3m, nres_3_6m, nres_6_15m, nres_15_30m]
  wealth_split: within_setting  # higher tier = Meta RWI above the median of its own setting (urban or rural);
                                # a national median would put almost every urban home in the top tier

classes:
  residential:
    - {when: {urban: true, rich: true}, profiles: {household_urban_upper: 1}}
    - {when: {urban: true, rich: false}, profiles: {household_urban_lower: 1}}
    - {when: {urban: false, rich: true}, profiles: {household_rural_upper: 1}}
    - {when: {urban: false, rich: false}, profiles: {household_rural_lower: 1}}
  mixed_shop_house:  # the household rule for its context, plus a small shop
    - {when: {}, profiles: {"@residential": 1, kiosk_shop: 1}}
  commercial:
    - {when: {overture_any: [restaurant, bar, cafe, coffee_shop, bar_and_grill_restaurant]}, profiles: {bar_restaurant: 1}}
    - {when: {overture_any: [hotel, lodging, bed_and_breakfast]}, profiles: {guesthouse: 1}}
    - {when: {overture_any: [beauty_salon, hair_salon, barber]}, profiles: {salon: 1}}
    - {when: {}, profiles: {kiosk_shop: 1}}
  institutional:
    - {when: {facility_prefix: "education"}, profiles: {school: 1}}
    - {when: {facility_prefix: "health"}, profiles: {health_post: 1}}
    - {when: {}, profiles: {office: 1}}
  religious:
    - {when: {}, profiles: {church: 1}}
  industrial_warehouse:
    - {when: {}, profiles: {warehouse_light: 1}}
  ancillary:
    - {when: {}, profiles: {}}  # kitchens, latrines, stores: negligible electricity
  unknown:
    - {when: {}, profiles: {"@residential": 1}}  # most unlabelled structures are homes; flagged via low confidence
