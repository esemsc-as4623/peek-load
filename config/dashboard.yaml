workflow:  # the data-architecture graph (workflow.json; workflow.mmd is generated from it)
  lanes:
    - {id: sources, label: Sources}
    - {id: ingest, label: Ingest and provenance}
    - {id: footprints, label: "A1 Footprints and heights"}
    - {id: context, label: "A2 Context"}
    - {id: climate, label: "A3 Climate"}
    - {id: labels, label: "A4 Building use"}
    - {id: evidence, label: "Evidence and appliance data"}
    - {id: demand, label: "Demand modelling"}
    - {id: validation, label: Validation}
    - {id: outputs, label: Outputs}
  nodes:
    - {id: src_vida, lane: sources, kind: source, label: "VIDA footprints (Google + Microsoft + OSM)", source: vida_buildings}
    - {id: src_google25d, lane: sources, kind: source, label: "Google Open Buildings 2.5D Temporal", source: google_25d_temporal}
    - {id: src_osm, lane: sources, kind: source, label: "OpenStreetMap (roads, land use, tags)", source: osm_geofabrik}
    - {id: src_overture, lane: sources, kind: source, label: "Overture places", source: overture_places}
    - {id: src_health, lane: sources, kind: source, label: "healthsites.io", source: health_facilities}
    - {id: src_admin, lane: sources, kind: source, label: "geoBoundaries ADM0-5", source: admin_boundaries}
    - {id: src_ghsl, lane: sources, kind: source, label: "GHSL BUILT-C 2018", source: ghsl_built_c}
    - {id: src_worldpop, lane: sources, kind: source, label: "WorldPop 2023", source: worldpop}
    - {id: src_rwi, lane: sources, kind: source, label: "Meta Relative Wealth Index", source: meta_rwi}
    - {id: src_gridfinder, lane: sources, kind: source, label: "Gridfinder MV lines", source: gridfinder}
    - {id: src_dem, lane: sources, kind: source, label: "Copernicus DEM GLO-30", source: copernicus_dem}
    - {id: src_era5, lane: sources, kind: source, label: "ERA5-Land (Open-Meteo / Copernicus CDS)", source: openmeteo}
    - {id: src_power, lane: sources, kind: source, label: "NASA POWER", source: nasa_power}
    - {id: src_microdata, lane: sources, kind: source, restricted: true, label: "Survey microdata: DHS 2025, MTF 2022, EICV5", source: mtf_rwanda}
    - {id: src_corpus, lane: sources, kind: source, label: "Evidence corpus (26 public reports)", source: evidence_docs}
    - {id: src_anchors, lane: sources, kind: source, label: "QSEL / REG / RURA consumption and tariffs", source: qsel_rwanda}
    - {id: manifest, lane: ingest, kind: process, label: "Download manifest (url, sha256, licence, time)", command: "pixi run fetch-* / register-local",
       description: "Every download goes through one function that records its URL, checksum, size, licence and retrieval time; raw files are never edited."}
    - {id: conform, lane: footprints, kind: process, label: "Conform footprints", command: "pixi run conform-buildings",
       description: "Repair geometries, flag overlaps and slivers (flag, don't drop), compute area, perimeter, compactness and orientation in UTM 35S, index to H3 r9, assign stable bldg_id."}
    - {id: t_base, lane: footprints, kind: table, label: "buildings_base", file: data/interim/buildings_base.parquet}
    - {id: heights, lane: footprints, kind: process, label: "Heights, floors, first seen", command: "pixi run conform-height && pixi run derive",
       description: "Sample Google 2.5D Temporal height and yearly presence (2016-2023) at each building; floors from height cut-points fitted on OSM building:levels (1 below 6.0 m, 2 below 8.5 m, +1 per 3 m); first-seen year where presence stays >= 0.5."}
    - {id: t_height, lane: footprints, kind: table, label: "building_height", file: data/interim/building_height.parquet}
    - {id: ctx_vector, lane: context, kind: process, label: "Vector context", command: "pixi run context-vector",
       description: "Distances to major roads, any road and predicted MV lines; POI counts within 50/100/250 m; OSM/Overture tags and health facilities; admin names to village level."}
    - {id: ctx_raster, lane: context, kind: process, label: "Raster context", command: "pixi run context-raster",
       description: "Sample GHSL settlement class and non-residential share, WorldPop density, Meta RWI and Copernicus DEM elevation at each building."}
    - {id: t_context, lane: context, kind: table, label: "building_context", file: data/interim/building_context.parquet}
    - {id: climate, lane: climate, kind: process, label: "Climate to H3 r7", command: "pixi run climate-h3",
       description: "ERA5-Land hourly 2 m temperature (0.1 deg, 2019-2024) interpolated to H3 r7 cell centres, corrected to cell elevation (-6.05 K/km), local time UTC+2; diurnal means, tmax_p95, CDD18/22/24, GHI; cooling class."}
    - {id: power_check, lane: climate, kind: process, label: "NASA POWER cross-check", command: "pixi run cooling-check",
       description: "Independent hourly temperatures at 4 towns confirm cooling demand is marginal in most of Rwanda."}
    - {id: t_climate, lane: climate, kind: table, label: "climate_h3", file: data/interim/climate_h3.parquet}
    - {id: codebook, lane: labels, kind: gate, label: "Codebook approval (human)"}
    - {id: cards, lane: labels, kind: process, label: "Context cards (open vector data only)", command: "pixi run cards",
       description: "A text card per building: footprint, height, size against neighbours, land use, road frontage, nearby tags and places, density, settlement class, wealth, distances. No imagery."}
    - {id: labeller, lane: labels, kind: process, label: "Claude Haiku 4.5 labeller", command: "pixi run label",
       description: "Returns probabilities over 9 use classes plus the cues it relied on; every call cached and costed (~$3.6 per 1,000 buildings)."}
    - {id: gold, lane: labels, kind: gate, label: "Human gold labels (173)"}
    - {id: label_eval, lane: labels, kind: process, label: "Label evaluation", command: "pixi run label-eval",
       description: "11 model/prompt configurations compared against human gold labels on accuracy, class variety and cost."}
    - {id: t_labels, lane: labels, kind: table, label: "labels", file: data/processed/labels.parquet}
    - {id: extraction, lane: evidence, kind: process, label: "Evidence extraction with citations", command: "pixi run evidence",
       description: "Values extracted from the corpus with document, page and quote; quotes verified verbatim on the page (81%)."}
    - {id: curation, lane: evidence, kind: process, label: "Hand-curated productive-use values", command: "pixi run curate-evidence",
       description: "37 values from NREL 2018, GIZ 2016 and the Power Africa Rwanda 2020 catalogue, each quote verified in code."}
    - {id: plausibility, lane: evidence, kind: process, label: "Automated plausibility checks", command: "pixi run validate-evidence",
       description: "Units, physical/market ranges per appliance and agreement between sources; 17 of 1,077 values flagged and excluded."}
    - {id: evidence_approval, lane: evidence, kind: gate, label: "Evidence approval (human)"}
    - {id: microdata_agg, lane: evidence, kind: process, restricted: true, label: "Microdata to weighted aggregates", command: "pixi run mtf-appliances && pixi run eicv5-electricity",
       description: "Appliance ownership, hours, enterprise and facility use, spending converted to kWh with the RURA tariff in force. Aggregates only; cells under 10 respondents suppressed."}
    - {id: t_anchors, lane: evidence, kind: table, label: "validation_anchors + MTF aggregates", file: data/processed/validation_anchors}
    - {id: builder, lane: demand, kind: process, label: "B1 archetype builder", command: "pixi run build-archetypes",
       description: "17 RAMP archetypes from recipes; every number cites survey data, evidence or measurements, or carries a written assumption; household lighting calibrated to MTF spending."}
    - {id: signoff, lane: demand, kind: gate, label: "Archetype sign-off (human, pending)"}
    - {id: t_archetypes, lane: demand, kind: table, label: "17 archetypes (draft)", file: data/processed/archetypes}
    - {id: mapping_approval, lane: demand, kind: gate, label: "Mapping approval (human)"}
    - {id: mapping, lane: demand, kind: process, label: "B2 building to profile mapping", command: "pixi run profile-mapping",
       description: "Class probabilities x context (urban/rural, RWI above or below the setting median) give profile weights per building."}
    - {id: t_weights, lane: demand, kind: table, label: "building_profiles", file: data/processed/building_profiles.parquet}
    - {id: ramp, lane: demand, kind: process, label: "B3 RAMP 0.5.2 simulation", command: "pixi run profile-library",
       description: "200 units x 28 days per profile; per-unit hourly means (all days, weekdays, weekends), daily kWh spread and coincident peaks."}
    - {id: t_library, lane: demand, kind: table, label: "profile_library", file: data/processed/profile_library.parquet}
    - {id: aggregation, lane: demand, kind: process, label: "B4 building and area metrics", command: "pixi run dashboard-data",
       description: "The five headline metrics per building (deep dives) and per selection, from weights x profiles."}
    - {id: checks, lane: validation, kind: process, label: "Profile checks", command: "pixi run profile-checks",
       description: "Households vs QSEL meter data and EICV5 spending; schools, mills and workshops vs MTF and NREL; MTF energy tiers."}
    - {id: qa, lane: validation, kind: process, label: "Table QA (schema contracts)", command: "pixi run qa",
       description: "Every table validated against its pandera contract; reports in reports/qa."}
    - {id: licence_review, lane: outputs, kind: gate, label: "Licence review (human)"}
    - {id: dataset, lane: outputs, kind: output, label: "Building energy dataset (GeoParquet / PostGIS)"}
    - {id: bundle, lane: outputs, kind: output, label: "Dashboard data bundle (this)"}
    - {id: docs, lane: outputs, kind: output, label: "Datasheet, QA and status reports"}
  edges:
    - [src_vida, manifest]
    - [src_google25d, manifest]
    - [src_osm, manifest]
    - [src_overture, manifest]
    - [src_health, manifest]
    - [src_admin, manifest]
    - [src_ghsl, manifest]
    - [src_worldpop, manifest]
    - [src_rwi, manifest]
    - [src_gridfinder, manifest]
    - [src_dem, manifest]
    - [src_era5, manifest]
    - [src_power, manifest]
    - [src_microdata, manifest]
    - [src_corpus, manifest]
    - [src_anchors, manifest]
