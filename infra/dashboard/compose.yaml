# The public dashboard as its own Tailscale machine, "peek-load-rwa", published with Funnel at
# https://peek-load-rwa.<tailnet>.ts.net. C3PO keeps its own name; nothing is exposed on the host.
#   cp .env.example .env    # then paste a Tailscale auth key into .env (never committed)
#   docker compose up -d
# The site and data are served from /srv/peek-load (see docs/hosting.md).
name: peek-load

services:
  ts:
    image: tailscale/tailscale:v1.76.6
    hostname: peek-load-rwa
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?put a Tailscale auth key in infra/dashboard/.env}
      TS_HOSTNAME: peek-load-rwa
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  web:
    image: caddy:2.8.4
    # no published ports: only reachable from the ts container, over the compose network
    environment:
      CADDY_BIND: 0.0.0.0
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/peek-load:/srv/peek-load:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  ts-state:
  caddy-data:
